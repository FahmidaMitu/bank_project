<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Account Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">MyBank</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <a class="nav-link text-white" href="{% url 'dashboard' %}">Dashboard</a>
                    <a class="nav-link text-white" href="{% url 'deposit' %}">Deposit</a>
                    <a class="nav-link text-white" href="{% url 'withdraw' %}">Withdraw</a>
                    <a class="nav-link text-white" href="{% url 'transactions' %}">History</a>
                    <a class="nav-link text-warning fw-bold" href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a class="nav-link text-white" href="{% url 'login' %}">Login</a>
                    <a class="nav-link text-white" href="{% url 'register' %}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
